<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f766e">
    <title>ایران‌گرد هیرکان | Irangard Hirkan</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --primary: #0f766e; --primary-hover: #115e59; --primary-light: #ccfbf1;
            --background: #f8fafc; --surface: #ffffff; --surface-secondary: #f1f5f9;
            --text-primary: #0f172a; --text-secondary: #64748b; --text-muted: #94a3b8;
            --border: #e2e8f0; --banner-background: #134e4a; --banner-text: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06); --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --radius-sm: 8px; --radius-md: 14px; --radius-lg: 20px;
            --font-persian: "Vazirmatn", Tahoma, sans-serif; --font-default: system-ui, -apple-system, sans-serif;
            --danger: #ef4444;
        }
        [data-theme="dark"] {
            --primary: #2dd4bf; --primary-light: #134e4a; --background: #0f172a;
            --surface: #1e293b; --surface-secondary: #334155; --text-primary: #f8fafc;
            --text-secondary: #cbd5e1; --border: #334155; --banner-background: #042f2e;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; background: var(--background); color: var(--text-primary);
            font-family: var(--font-default); font-size: 15px; line-height: 1.7; transition: background 0.2s, color 0.2s;
        }
        html[lang="fa"] { font-family: var(--font-persian); }
        a { color: inherit; text-decoration: none; } button { cursor: pointer; font: inherit; }

        .app-container { max-width: 900px; margin-inline: auto; min-height: 100vh; position: relative; }
        .main-content { padding: 20px 16px 100px; }

        .topbar {
            height: 64px; display: flex; align-items: center; justify-content: space-between;
            padding-inline: 16px; background: var(--surface); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 8px; color: var(--primary); font-size: 19px; font-weight: 700; cursor: pointer; }
        .icon-button {
            width: 40px; height: 40px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface); color: var(--text-primary); display: flex; align-items: center; justify-content: center;
        }
        .language-button { padding: 8px 12px; background: var(--primary-light); color: var(--primary); border: none; border-radius: var(--radius-sm); font-weight: 700; }

        /* Bottom Nav (Adjusted for 6 items) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 900px; height: 68px; display: flex; align-items: center; justify-content: space-around;
            background: var(--surface); border-top: 1px solid var(--border); z-index: 100;
            padding: 0 4px;
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-muted); font-size: 10px; cursor: pointer; }
        .nav-icon { font-size: 20px; }
        .nav-item.active { color: var(--primary); font-weight: 700; }

        .page-title { margin: 0 0 8px; font-size: 25px; font-weight: 700; }
        .page-subtitle { margin: 0 0 22px; color: var(--text-secondary); font-size: 14px; }
        
        .section-header { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 14px; }
        .section-title { margin: 0; font-size: 19px; font-weight: 700; }
        .view-all { font-size: 14px; color: var(--primary); font-weight: 700; cursor: pointer; }
        
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 12px; position: relative; }
        .card.clickable { cursor: pointer; transition: transform 0.2s; }
        .card.clickable:active { transform: scale(0.98); }
        .card-title { margin: 0 0 6px; font-size: 17px; font-weight: 700; color: var(--primary); padding-left: 30px; }
        .card-description { margin: 0; color: var(--text-secondary); font-size: 13px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
        .button {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 44px; padding: 10px 18px; border: none; border-radius: var(--radius-md);
            background: var(--primary); color: #fff; font-weight: 700; margin-top: 16px; text-decoration: none;
        }
        .button-outline {
            background: var(--surface-secondary); color: var(--text-primary); border: 1px solid var(--border);
            margin-bottom: 20px;
        }
        .search-container { position: relative; margin: 20px 0; }
        .input {
            width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--border);
            border-radius: var(--radius-md); background: var(--surface); color: var(--text-primary); outline: none;
        }
        .input:focus { border-color: var(--primary); }

        .badge {
            display: inline-block; padding: 4px 10px; background: var(--primary-light);
            color: var(--primary); border-radius: 30px; font-size: 12px; font-weight: 700; margin-bottom: 8px;
        }
        .tips-box {
            background: var(--surface-secondary); border-right: 4px solid var(--primary);
            padding: 12px; border-radius: var(--radius-sm); margin-top: 16px; font-size: 14px;
        }

        /* Tabs for Travel Info */
        .tabs { display: flex; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: 700; color: var(--text-secondary); border-bottom: 3px solid transparent; transition: all 0.2s; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        /* Heart Icon (Favorites) */
        .fav-btn {
            position: absolute; top: 14px; left: 14px;
            background: none; border: none; font-size: 22px; padding: 0;
            color: var(--text-muted); transition: color 0.2s;
        }
        [dir="ltr"] .fav-btn { left: auto; right: 14px; }
        .fav-btn.active { color: var(--danger); }

        .hirkan-banner {
            margin-top: 32px; padding: 18px; background: var(--banner-background); color: var(--banner-text);
            border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .hirkan-banner-title { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
        .hirkan-banner-description { margin: 0; font-size: 12px; opacity: 0.85; }
        .hirkan-banner-link { padding: 8px 12px; border: 1px solid rgba(255,255,255,0.5); border-radius: var(--radius-sm); color: white; font-size: 12px; font-weight: 700; }
    </style>
</head>

            { id: 'milad-tower', name_fa: 'برج میلاد', name_en: 'Milad Tower', city_id: 'tehran', province_id: 'tehran', category_fa: 'جاذبه شهری', category_en: 'Urban Attraction', desc_fa: 'برج میلاد یکی از بلندترین برج‌های ایران و از نمادهای مدرن شهر تهران است. این برج دارای سکوی دید باز، فضاهای تفریحی، رستوران‌ها و امکانات فرهنگی و گردشگری است.', desc_en: 'Milad Tower is one of Iran’s tallest towers and a modern symbol of Tehran. It features observation decks, recreational spaces, restaurants, and cultural and tourist facilities.', tips_fa: 'در روزهای صاف برای تماشای چشم‌انداز گسترده تهران مراجعه کنید.', tips_en: 'Visit on a clear day for expansive views of Tehran.' },
            { id: 'shah-cheragh', name_fa: 'شاهچراغ', name_en: 'Shah Cheragh Shrine', city_id: 'shiraz', province_id: 'fars', category_fa: 'زیارتگاه تاریخی', category_en: 'Historic Shrine', desc_fa: 'شاهچراغ آرامگاه احمد بن موسی، از شخصیت‌های مهم تاریخی و مذهبی شیراز است. فضای داخلی زیارتگاه با آینه‌کاری‌های درخشان، کاشی‌های رنگارنگ و معماری چشمگیر تزئین شده است.', desc_en: 'Shah Cheragh is the shrine of Ahmad ibn Musa, an important historical and religious figure in Shiraz. Its interior is decorated with brilliant mirror mosaics, colorful tiles, and striking architectural details.', tips_fa: 'هنگام بازدید، مقررات پوشش و عکاسی مجموعه را رعایت کنید.', tips_en: 'Respect the shrine’s dress code and photography regulations.' },
            { id: 'hafez-tomb', name_fa: 'آرامگاه حافظ', name_en: 'Tomb of Hafez', city_id: 'shiraz', province_id: 'fars', category_fa: 'آرامگاه تاریخی', category_en: 'Historic Tomb', desc_fa: 'آرامگاه حافظ، شاعر نامدار ایرانی، در باغی زیبا به نام حافظیه قرار دارد. معماری آرامگاه، فضای شاعرانه باغ و حضور دوستداران شعر فارسی، این مکان را به یکی از محبوب‌ترین جاذبه‌های فرهنگی شیراز تبدیل کرده است.', desc_en: 'The Tomb of Hafez, the resting place of the renowned Persian poet, is located in the beautiful Hafezieh Garden. Its architecture, poetic atmosphere, and visitors celebrating Persian literature make it one of Shiraz’s most beloved cultural attractions.', tips_fa: 'عصر هنگام برای تجربه فضای شاعرانه حافظیه زمان مناسبی است.', tips_en: 'Visit in the evening to enjoy the garden’s poetic atmosphere.' },
            { id: 'saadi-tomb', name_fa: 'آرامگاه سعدی', name_en: 'Tomb of Saadi', city_id: 'shiraz', province_id: 'fars', category_fa: 'آرامگاه تاریخی', category_en: 'Historic Tomb', desc_fa: 'آرامگاه سعدی در باغی سرسبز در شمال شرقی شیراز قرار دارد و محل دفن یکی از بزرگ‌ترین شاعران ادبیات فارسی است. معماری آرامگاه و حوض ماهی معروف آن، فضایی آرام و فرهنگی برای بازدیدکنندگان ایجاد کرده‌اند.', desc_en: 'The Tomb of Saadi is situated in a green garden in northeastern Shiraz and commemorates one of the greatest poets of Persian literature. Its architectural design and famous fish pond create a peaceful cultural atmosphere for visitors.', tips_fa: 'از فضای باغ و حوض ماهی نیز در کنار آرامگاه دیدن کنید.', tips_en: 'Take time to explore the garden and its famous fish pond.' },
            { id: 'arg-e-karim-khan', name_fa: 'ارگ کریم‌خان', name_en: 'Arg of Karim Khan', city_id: 'shiraz', province_id: 'fars', category_fa: 'بنای تاریخی', category_en: 'Historical Monument', desc_fa: 'ارگ کریم‌خان در مرکز شیراز به دستور کریم‌خان زند ساخته شد و زمانی محل اقامت و حکومت او بود. برج‌های بلند، دیوارهای مستحکم و معماری آجری این بنا از ویژگی‌های شاخص آن هستند.', desc_en: 'The Arg of Karim Khan was built in central Shiraz by order of Karim Khan Zand and once served as his residence and seat of government. Its tall towers, fortified walls, and brick architecture are among its most distinctive features.', tips_fa: 'جزئیات برج‌ها و تزئینات معماری داخلی را با دقت مشاهده کنید.', tips_en: 'Pay attention to the towers and the interior architectural details.' },
            { id: 'chogha-zanbil', name_fa: 'چغازنبیل', name_en: 'Chogha Zanbil', city_id: 'shush', province_id: 'khuzestan', category_fa: 'میراث جهانی یونسکو', category_en: 'UNESCO World Heritage', desc_fa: 'چغازنبیل یکی از مهم‌ترین زیگورات‌های باستانی جهان است که در تمدن ایلام ساخته شده است. این بنای مذهبی باستانی دارای ساختاری پلکانی و بقایای معابد و سازه‌های تاریخی ارزشمند است.', desc_en: 'Chogha Zanbil is one of the most important ancient ziggurats in the world, built by the Elamite civilization. This ancient religious monument features a stepped structure and the remains of valuable temples and historical buildings.', tips_fa: 'برای بازدید از محوطه وسیع، کفش مناسب و آب آشامیدنی همراه داشته باشید.', tips_en: 'Bring comfortable shoes and drinking water when exploring the site.' },
            { id: 'susa-ancient-city', name_fa: 'شهر باستانی شوش', name_en: 'Ancient City of Susa', city_id: 'shush', province_id: 'khuzestan', category_fa: 'میراث جهانی یونسکو', category_en: 'UNESCO World Heritage', desc_fa: 'شوش یکی از کهن‌ترین مراکز تمدنی ایران و جهان است که تاریخ سکونت در آن به هزاران سال پیش بازمی‌گردد. بقایای کاخ‌های باستانی، محوطه‌های باستان‌شناسی و آثار تاریخی متعدد، اهمیت این شهر را نشان می‌دهند.', desc_en: 'Susa is one of the oldest centers of civilization in Iran and the world, with a history of settlement dating back thousands of years. Ancient palace remains, archaeological areas, and numerous historical artifacts demonstrate the importance of this city.', tips_fa: 'بازدید از موزه شوش و قلعه تاریخی شوش را نیز در برنامه قرار دهید.', tips_en: 'Include the Susa Museum and historic Susa Castle in your visit.' },
            { id: 'shushtar-historical-hydraulic-system', name_fa: 'سازه‌های آبی تاریخی شوشتر', name_en: 'Shushtar Historical Hydraulic System', city_id: 'shushtar', province_id: 'khuzestan', category_fa: 'میراث جهانی یونسکو', category_en: 'UNESCO World Heritage', desc_fa: 'سازه‌های آبی شوشتر مجموعه‌ای شگفت‌انگیز از آسیاب‌ها، کانال‌ها، پل‌ها و آبشارهای مصنوعی هستند که قدمت بخش‌هایی از آن‌ها به دوران باستان می‌رسد. این مجموعه نمونه‌ای برجسته از مهندسی آب و مدیریت منابع طبیعی در ایران تاریخی است.', desc_en: 'The Shushtar Historical Hydraulic System is an extraordinary network of watermills, canals, bridges, and artificial waterfalls, with parts dating back to ancient times. It is an outstanding example of water engineering and resource management in historic Iran.', tips_fa: 'در ساعات روشنایی روز از محوطه آسیاب‌ها و آبشارها بازدید کنید.', tips_en: 'Visit the watermills and waterfalls during daylight hours.' },
            { id: 'bishapur', name_fa: 'شهر باستانی بیشاپور', name_en: 'Bishapur Ancient City', city_id: 'kazerun', province_id: 'fars', category_fa: 'میراث تاریخی', category_en: 'Historical Heritage', desc_fa: 'بیشاپور شهری باستانی از دوره ساسانی است که به دستور شاپور اول ساخته شد. بقایای کاخ‌ها، معابد و نقش‌برجسته‌های ساسانی این شهر، اطلاعات ارزشمندی درباره هنر و معماری آن دوران ارائه می‌کنند.', desc_en: 'Bishapur is an ancient Sassanian city founded by order of Shapur I. Its palace ruins, temples, and Sassanian rock reliefs provide valuable insights into the art and architecture of that era.', tips_fa: 'بازدید از نقش‌برجسته‌های تنگ چوگان را با شهر بیشاپور ترکیب کنید.', tips_en: 'Combine your visit with the rock reliefs of Tang-e Chogan.' },
            { id: 'arg-e-bam', name_fa: 'ارگ بم', name_en: 'Bam Citadel', city_id: 'bam', province_id: 'kerman', category_fa: 'میراث جهانی یونسکو', category_en: 'UNESCO World Heritage', desc_fa: 'ارگ بم یکی از بزرگ‌ترین سازه‌های خشتی جهان و نمونه‌ای برجسته از معماری سنتی مناطق کویری ایران است. این مجموعه تاریخی شامل بخش‌های مسکونی، نظامی، حکومتی و فضاهای عمومی بوده است.', desc_en: 'Bam Citadel is one of the largest adobe structures in the world and an outstanding example of traditional architecture in Iran’s desert regions. The historic complex once included residential, military, governmental, and public areas.', tips_fa: 'پیش از بازدید، وضعیت بخش‌های قابل دسترس مجموعه را بررسی کنید.', tips_en: 'Check which sections of the citadel are accessible before visiting.' },
            { id: 'shahzadeh-garden', name_fa: 'باغ شاهزاده ماهان', name_en: 'Shazdeh Garden', city_id: 'mahan', province_id: 'kerman', category_fa: 'میراث جهانی یونسکو', category_en: 'UNESCO World Heritage', desc_fa: 'باغ شاهزاده ماهان یکی از زیباترین باغ‌های تاریخی ایران است که در نزدیکی شهر ماهان قرار دارد. حوض‌ها، فواره‌ها، درختان سرسبز و عمارت انتهایی باغ، نمونه‌ای چشمگیر از باغ‌سازی ایرانی هستند.', desc_en: 'Shazdeh Garden is one of Iran’s most beautiful historic gardens, located near the town of Mahan. Its pools, fountains, green trees, and elegant pavilion represent the remarkable tradition of Persian garden design.', tips_fa: 'بهار و اوایل پاییز زمان مناسبی برای بازدید از باغ است.', tips_en: 'Spring and early autumn are pleasant seasons to visit the garden.' },
            { id: 'goharshad-mosque', name_fa: 'مسجد گوهرشاد', name_en: 'Goharshad Mosque', city_id: 'mashhad', province_id: 'razavi-khorasan', category_fa: 'مسجد تاریخی', category_en: 'Historic Mosque', desc_fa: 'مسجد گوهرشاد از بناهای برجسته دوره تیموری است که به دستور گوهرشاد بیگم ساخته شد. کاشی‌کاری‌های نفیس، گنبد بزرگ و ایوان‌های باشکوه آن از نمونه‌های ارزشمند معماری اسلامی ایران هستند.', desc_en: 'Goharshad Mosque is a remarkable Timurid monument commissioned by Goharshad Begum. Its exquisite tilework, large dome, and magnificent iwans are outstanding examples of Iranian Islamic architecture.', tips_fa: 'برای مشاهده تزئینات کاشی‌کاری، از ایوان‌های اصلی بازدید کنید.', tips_en: 'Explore the main iwans to appreciate the intricate tile decorations.' },
            { id: 'imam-reza-shrine', name_fa: 'حرم امام رضا', name_en: 'Imam Reza Shrine', city_id: 'mashhad', province_id: 'razavi-khorasan', category_fa: 'مجموعه مذهبی و تاریخی', category_en: 'Religious and Historical Complex', desc_fa: 'حرم امام رضا یکی از بزرگ‌ترین مجموعه‌های مذهبی و معماری ایران است که در شهر مشهد قرار دارد. این مجموعه شامل صحن‌ها، رواق‌ها، کتابخانه‌ها، موزه‌ها و بناهای تاریخی با تزئینات هنری چشمگیر است.', desc_en: 'The Imam Reza Shrine is one of Iran’s largest religious and architectural complexes, located in Mashhad. It includes courtyards, prayer halls, libraries, museums, and historic buildings featuring remarkable artistic decorations.', tips_fa: 'پیش از ورود، مقررات امنیتی و وسایل مجاز مجموعه را بررسی کنید.', tips_en: 'Check the complex’s security regulations and permitted belongings before entering.' },
            { id: 'tomb-of-ferdowsi', name_fa: 'آرامگاه فردوسی', name_en: 'Tomb of Ferdowsi', city_id: 'tus', province_id: 'razavi-khorasan', category_fa: 'آرامگاه تاریخی', category_en: 'Historic Tomb', desc_fa: 'آرامگاه فردوسی در شهر تاریخی توس قرار دارد و یادبود حکیم ابوالقاسم فردوسی، سراینده شاهنامه است. معماری آرامگاه و فضای فرهنگی اطراف آن، اهمیت فردوسی در حفظ زبان و ادبیات فارسی را یادآوری می‌کند.', desc_en: 'The Tomb of Ferdowsi is located in the historic city of Tus and commemorates Abolqasem Ferdowsi, the author of the Shahnameh. Its architecture and cultural surroundings celebrate his contribution to preserving Persian language and literature.', tips_fa: 'بازدید از موزه فردوسی و محوطه تاریخی توس را فراموش نکنید.', tips_en: 'Do not miss the Ferdowsi Museum and the surrounding historic grounds.' },
            { id: 'soltaniyeh-dome', name_fa: 'گنبد سلطانیه', name_en: 'Soltaniyeh Dome', city_id: 'soltaniyeh', province_id: 'zanjan', category_fa: 'میراث جهانی یونسکو', category_en: 'UNESCO World Heritage', desc_fa: 'گنبد سلطانیه آرامگاه الجایتو از پادشاهان ایلخانی و یکی از بزرگ‌ترین گنبدهای آجری جهان است. ساختار هشت‌ضلعی، گنبد فیروزه‌ای و تزئینات داخلی آن از شاهکارهای معماری دوره ایلخانی به شمار می‌روند.', desc_en: 'The Soltaniyeh Dome is the mausoleum of Öljaitü, an Ilkhanid ruler, and one of the largest brick domes in the world. Its octagonal structure, turquoise dome, and interior decorations are masterpieces of Ilkhanid architecture.', tips_fa: 'برای مشاهده تزئینات داخلی، از بخش‌های مختلف فضای داخلی بازدید کنید.', tips_en: 'Explore the interior to appreciate its architectural decorations.' },
            { id: 'takht-e-soleyman', name_fa: 'تخت سلیمان', name_en: 'Takht-e Soleyman', city_id: 'takab', province_id: 'west-azerbaijan', category_fa: 'میراث جهانی یونسکو', category_en: 'UNESCO World Heritage', desc_fa: 'تخت سلیمان محوطه‌ای باستانی شامل بقایای آتشکده آذرگشنسب و مجموعه‌ای از بناهای دوره ساسانی و ایلخانی است. دریاچه طبیعی مرکزی و آثار معماری اطراف آن، این مکان را به یکی از مهم‌ترین محوطه‌های تاریخی ایران تبدیل کرده‌اند.', desc_en: 'Takht-e Soleyman is an archaeological site containing the remains of the Azargoshnasp fire temple and buildings from the Sassanian and Ilkhanid periods. Its central natural lake and surrounding architectural remains make it one of Iran’s most important historic sites.', tips_fa: 'برای پیاده‌روی در محوطه تاریخی کفش مناسب همراه داشته باشید.', tips_en: 'Wear comfortable shoes for walking around the archaeological site.' },
            { id: 'bisotun', name_fa: 'کتیبه بیستون', name_en: 'Behistun Inscription', city_id: 'bisotun', province_id: 'kermanshah', category_fa: 'میراث جهانی یونسکو', category_en: 'UNESCO World Heritage', desc_fa: 'کتیبه بیستون یکی از مهم‌ترین آثار تاریخی دوره هخامنشی است که به دستور داریوش بزرگ ایجاد شد. این کتیبه چندزبانه همراه با نقش‌برجسته‌های آن، روایتگر به قدرت رسیدن داریوش و رویدادهای مهم دوران اوست.', desc_en: 'The Behistun Inscription is one of the most important historical monuments of the Achaemenid period, commissioned by Darius the Great. Its multilingual inscription and accompanying reliefs describe Darius’s rise to power and important events of his reign.', tips_fa: 'برای مشاهده بهتر کتیبه از فاصله مناسب و نقاط مجاز استفاده کنید.', tips_en: 'Use designated viewing areas and suitable distances to observe the inscription.' }

                    { title_fa: "آداب معاشرت و فرهنگ", title_en: "Etiquette & Culture", desc_fa: "ایرانیان بسیار مهمان‌نواز هستند. هنگام ورود به خانه یا اماکن مذهبی کفش‌ها را درآورید. در اماکن زیارتی، عکاسی با دوربین حرفه‌ای گاهی محدود است. اجازه گرفتن قبل از عکاسی از افراد، نشانه احترام است.", desc_en: "Iranians are very hospitable. Remove your shoes when entering homes or religious places. In shrines, professional photography is sometimes restricted. Asking for permission before taking photos of people is a sign of respect." },
                    { title_fa: "ایمنی و شماره‌های ضروری", title_en: "Safety & Emergency", desc_fa: "ایران یکی از امن‌ترین کشورهای منطقه است، اما مراقب وسایل خود در مکان‌های شلوغ باشید. شماره‌های مهم: پلیس ۱۱۰، اورژانس ۱۱۵، آتش‌نشانی ۱۲۵، هلال احمر ۱۱۲، راهداری ۱۲۳.", desc_en: "Iran is one of the safest countries in the region, but watch your belongings in crowded places. Emergency numbers: Police 110, Ambulance 115, Fire 125, Red Crescent 112, Road Rescue 123." },
                    { title_fa: "غذا و رستوران‌ها", title_en: "Food & Restaurants", desc_fa: "غذاهای ایرانی مانند کباب، چلوخورش، دیزی و آش بسیار متنوع هستند. آب شیر در بیشتر شهرها قابل شرب است، اما برای احتیاط می‌توانید از آب معدنی استفاده کنید. حتماً شیرینی‌های سنتی شهرهای مختلف را امتحان کنید.", desc_en: "Persian cuisine like Kebab, Chelow Khoresh, Dizi, and Ash is very diverse. Tap water is drinkable in most cities, but bottled water is recommended for caution. Make sure to try traditional sweets in different cities." }
                ]
            }
        };

        // =========================================
        // STATE & STORAGE
        // =========================================
        let currentLang = localStorage.getItem('irangard_lang') || "fa";
        let currentTheme = localStorage.getItem('irangard_theme') || "light";
        let favorites = JSON.parse(localStorage.getItem('irangard_favs')) || [];
        let activeTravelTab = "before"; // before | during

        // =========================================
        // TRANSLATIONS
        // =========================================
        const TRANSLATIONS = {

                "nav.home": "خانه", "nav.provinces": "استان‌ها", "nav.attractions": "جاذبه‌ها", "nav.travel": "سفر", "nav.favorites": "علاقه‌مندی", "nav.settings": "تنظیمات",

                "search.placeholder": "جستجوی استان، شهر یا جاذبه...", "search.results": "نتایج جستجو",

                "featured.attractions": "جاذبه‌های شاخص ایران",
                "travel.title": "اطلاعات و راهنمای سفر", "travel.before": "پیش از سفر", "travel.during": "در حین سفر",
                "settings.title": "تنظیمات", "settings.theme": "حالت نمایش", "settings.theme.desc": "تغییر بین حالت روز و شب",
                "settings.lang": "زبان برنامه", "settings.lang.desc": "تغییر زبان برنامه (فارسی/انگلیسی)",
                "settings.clear_fav": "پاک کردن علاقه‌مندی‌ها", "settings.clear_fav.desc": "حذف تمام موارد نشان‌شده",
                "settings.clear_btn": "پاک کن", "settings.version": "نسخه برنامه",
                "fav.empty": "هنوز هیچ موردی را نشان نکرده‌اید. با زدن آیکون قلب (♡) روی کارت‌ها، آن‌ها را اینجا ذخیره کنید.",
                "fav.title": "علاقه‌مندی‌های من"
            },
            "en": {
                "home.title": "Welcome to Irangard Hirkan", "home.desc": "Discover the beauty of Iran",
                "nav.home": "Home", "nav.provinces": "Provinces", "nav.attractions": "Attractions", "nav.travel": "Travel", "nav.favorites": "Favorites", "nav.settings": "Settings",
                "hirkan.title": "Developed by Hirkan", "hirkan.desc": "Designed and developed by Hirkan Develop Group", "hirkan.btn": "Hirkan Website",
                "search.placeholder": "Search province, city or attraction...", "search.results": "Search Results",
                "provinces.title": "Provinces of Iran", "province.capital": "Capital",
                "attractions.title": "Tourist Attractions of Iran", "city.attractions": "Tourist Attractions",
                "attraction.city": "City", "attraction.province": "Province", "attraction.tips": "Visiting Tips",
                "btn.back": "Back", "btn.view_city": "View City", "btn.view_all": "View All",
                "no.results": "No results found.", "no.attractions": "No attractions recorded for this city yet.",
                "featured.attractions": "Featured Attractions of Iran",
                "travel.title": "Travel Guide & Information", "travel.before": "Before Travel", "travel.during": "During Travel",
                "settings.title": "Settings", "settings.theme": "Theme Mode", "settings.theme.desc": "Switch between Light and Dark mode",
                "settings.lang": "App Language", "settings.lang.desc": "Change app language (Persian/English)",
                "settings.clear_fav": "Clear Favorites", "settings.clear_fav.desc": "Remove all saved items",
                "settings.clear_btn": "Clear", "settings.version": "App Version",
                "fav.empty": "You haven't liked anything yet. Tap the heart icon (♡) on cards to save them here.",
                "fav.title": "My Favorites"
            }
        };

        // =========================================
        // INIT
        // =========================================
        document.documentElement.setAttribute('data-theme', currentTheme);
        document.getElementById('theme-toggle').textContent = currentTheme === 'light' ? '☾' : '☀';
        
        document.documentElement.lang = currentLang;
        document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
        document.getElementById('lang-toggle').textContent = currentLang === 'fa' ? 'EN' : 'FA';

        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);
        document.getElementById('lang-toggle').addEventListener('click', toggleLanguage);

        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', () => {
            if (!window.location.hash) window.location.hash = '#/';
            router();
        });

        // =========================================
        // ACTIONS
        // =========================================
        function toggleTheme() {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('theme-toggle').textContent = currentTheme === 'light' ? '☾' : '☀';
            localStorage.setItem('irangard_theme', currentTheme);
            if(window.location.hash === '#/settings' || window.location.hash === '#/travel') router();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'fa' ? 'en' : 'fa';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
            document.getElementById('lang-toggle').textContent = currentLang === 'fa' ? 'EN' : 'FA';
            localStorage.setItem('irangard_lang', currentLang);
            router();
        }

        function toggleFavorite(id, event) {
            event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(f => f !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('irangard_favs', JSON.stringify(favorites));
            router();
        }

        function clearFavorites() {
            if(confirm('Are you sure? / آیا مطمئن هستید؟')) {
                favorites = [];
                localStorage.setItem('irangard_favs', JSON.stringify(favorites));
                router();
            }
        }

        function switchTravelTab(tab) {
            activeTravelTab = tab;
            renderTravel(TRANSLATIONS[currentLang]);
        }

        // =========================================
        // ROUTER
        // =========================================
        function router() {
            let hash = window.location.hash.replace(/^#\/?/, '');
            if (!hash) hash = 'home';
            
            const parts = hash.split('/');
            const t = TRANSLATIONS[currentLang];

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            const routeName = parts[0];

            if (routeName === 'province' && parts[1]) {
                renderProvince(parts[1], t);
            } else if (routeName === 'city' && parts[1]) {
                renderCity(parts[1], t);
            } else if (routeName === 'attraction' && parts[1]) {
                renderAttraction(parts[1], t);
            } else if (routeName === 'provinces') {
                document.querySelector('[data-route="provinces"]').classList.add('active');
                renderProvincesList(t);
            } else if (routeName === 'attractions') {
                document.querySelector('[data-route="attractions"]').classList.add('active');
                renderAttractionsList(t);
            } else if (routeName === 'travel') {
                document.querySelector('[data-route="travel"]').classList.add('active');
                renderTravel(t);
            } else if (routeName === 'favorites') {
                document.querySelector('[data-route="favorites"]').classList.add('active');
                renderFavorites(t);
            } else if (routeName === 'settings') {
                document.querySelector('[data-route="settings"]').classList.add('active');
                renderSettings(t);
            } else {
                document.querySelector('[data-route="home"]').classList.add('active');
                renderHome(t);
            }
            window.scrollTo(0, 0);
        }

        // =========================================
        // VIEWS
        // =========================================
        function renderHome(t) {
            const featured = ATTRACTIONS_DATA.filter(a => a.category_fa.includes('یونسکو')).slice(0, 6);
            const homeProvinces = PROVINCES_DATA.slice(0, 6);

            const html = `
                <h1 class="page-title">${t['home.title']}</h1>
                <p class="page-subtitle">${t['home.desc']}</p>
                
                <div class="search-container">
                    <input type="search" id="search-input" class="input" placeholder="${t['search.placeholder']}" oninput="performSearch(this.value)" />
                </div>

                <div id="search-results" style="display:none; margin-bottom: 20px;">
                    <h2 class="section-title" style="margin-top:0;">${t['search.results']}</h2>
                    <div id="search-grid" class="grid"></div>
                </div>

                <div id="main-content-area">
                    <div class="section-header">
                        <h2 class="section-title">${t['featured.attractions']}</h2>
                        <span class="view-all" onclick="window.location.hash='#/attractions'">${t['btn.view_all']} ←</span>
                    </div>
                    <div class="grid" style="margin-bottom: 30px;">
                        ${featured.map(a => generateAttractionCard(a, t)).join('')}
                    </div>

                    <div class="section-header">
                        <h2 class="section-title">${t['provinces.title']}</h2>
                        <span class="view-all" onclick="window.location.hash='#/provinces'">${t['btn.view_all']} ←</span>
                    </div>
                    <div id="provinces-grid" class="grid">
                        ${generateProvinceCards(homeProvinces, t)}
                    </div>
                </div>

                ${getHirkanBanner(t)}
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderTravel(t) {
            const info = TRAVEL_INFO_DATA[activeTravelTab];
            const dataList = info.items;
            const tabTitle = activeTravelTab === 'before' ? t['travel.before'] : t['travel.during'];

            const html = `
                <h1 class="page-title">${t['travel.title']}</h1>
                
                <div class="tabs">
                    <div class="tab ${activeTravelTab === 'before' ? 'active' : ''}" onclick="switchTravelTab('before')">${t['travel.before']}</div>
                    <div class="tab ${activeTravelTab === 'during' ? 'active' : ''}" onclick="switchTravelTab('during')">${t['travel.during']}</div>
                </div>

                <h2 class="section-title">${tabTitle}</h2>
                
                <div style="display:flex; flex-direction:column; gap:12px;">
                    ${dataList.map(item => `
                        <div class="card">
                            <h3 class="card-title" style="padding-left:0; color:var(--text-primary);">${currentLang === 'fa' ? item.title_fa : item.title_en}</h3>
                            <p class="card-description" style="font-size:14px; margin-top:8px; color:var(--text-primary);">
                                ${currentLang === 'fa' ? item.desc_fa : item.desc_en}
                            </p>
                        </div>
                    `).join('')}
                </div>

                ${getHirkanBanner(t)}
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderProvincesList(t) {
            const html = `
                <h1 class="page-title">${t['provinces.title']}</h1>
                <div class="grid">
                    ${generateProvinceCards(PROVINCES_DATA, t)}
                </div>
                ${getHirkanBanner(t)}
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderAttractionsList(t) {
            const html = `
                <h1 class="page-title">${t['attractions.title']}</h1>
                <div class="search-container">
                    <input type="search" id="attr-search-input" class="input" placeholder="${t['search.placeholder']}" oninput="filterAttractionsPage(this.value)" />
                </div>
                <div id="all-attractions-grid" class="grid">
                    ${ATTRACTIONS_DATA.map(a => generateAttractionCard(a, t)).join('')}
                </div>
                ${getHirkanBanner(t)}
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderProvince(id, t) {
            const prov = PROVINCES_DATA.find(p => p.id === id);
            if (!prov) return renderHome(t);

            const capital = CITIES_DATA.find(c => c.id === prov.capital_id);
            const name = currentLang === 'fa' ? prov.name_fa : prov.name_en;
            const desc = currentLang === 'fa' ? prov.desc_fa : prov.desc_en;
            const capName = capital ? (currentLang === 'fa' ? capital.name_fa : capital.name_en) : '';
            
            const provAttractions = ATTRACTIONS_DATA.filter(a => a.province_id === prov.id);

            const html = `
                <button class="button button-outline" onclick="history.back()">← ${t['btn.back']}</button>
                <h1 class="page-title">${name}</h1>
                <p class="page-subtitle">${desc}</p>

                <div class="card">
                    <h2 class="card-title">${t['province.capital']}</h2>
                    <p class="card-description">${capName}</p>
                    ${capital ? `<button class="button" onclick="window.location.hash='#/city/${capital.id}'">${t['btn.view_city']}</button>` : ''}
                </div>

                <h2 class="section-title">${t['city.attractions']}</h2>
                <div class="grid">
                    ${provAttractions.length ? provAttractions.map(a => generateAttractionCard(a, t)).join('') : `<p>${t['no.attractions']}</p>`}
                </div>

                ${getHirkanBanner(t)}
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderCity(id, t) {
            const city = CITIES_DATA.find(c => c.id === id);
            if (!city) return renderHome(t);
            
            const prov = PROVINCES_DATA.find(p => p.id === city.province_id);
            const name = currentLang === 'fa' ? city.name_fa : city.name_en;
            const desc = currentLang === 'fa' ? city.desc_fa : city.desc_en;
            const provName = prov ? (currentLang === 'fa' ? prov.name_fa : prov.name_en) : '';
            
            const cityAttractions = ATTRACTIONS_DATA.filter(a => a.city_id === city.id);

            const html = `
                <button class="button button-outline" onclick="history.back()">← ${t['btn.back']}</button>
                <h1 class="page-title">${name}</h1>
                <p class="page-subtitle" onclick="window.location.hash='#/province/${city.province_id}'" style="cursor:pointer; color:var(--primary)">
                    ${provName} ↗
                </p>

                <div class="card">
                    <p class="card-description" style="font-size: 15px;">${desc}</p>
                </div>

                <h2 class="section-title">${t['city.attractions']}</h2>
                <div class="grid">
                    ${cityAttractions.length ? cityAttractions.map(a => generateAttractionCard(a, t)).join('') : `<p>${t['no.attractions']}</p>`}
                </div>

                ${getHirkanBanner(t)}
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderAttraction(id, t) {
            const attr = ATTRACTIONS_DATA.find(a => a.id === id);
            if (!attr) return renderHome(t);

            const name = currentLang === 'fa' ? attr.name_fa : attr.name_en;
            const desc = currentLang === 'fa' ? attr.desc_fa : attr.desc_en;
            const cat = currentLang === 'fa' ? attr.category_fa : attr.category_en;
            const tips = currentLang === 'fa' ? attr.tips_fa : attr.tips_en;
            
            const city = CITIES_DATA.find(c => c.id === attr.city_id);
            const prov = PROVINCES_DATA.find(p => p.id === attr.province_id);
            
            const cityName = city ? (currentLang === 'fa' ? city.name_fa : city.name_en) : null;
            const provName = prov ? (currentLang === 'fa' ? prov.name_fa : prov.name_en) : null;

            const isFav = favorites.includes(attr.id);

            const html = `
                <button class="button button-outline" onclick="history.back()">← ${t['btn.back']}</button>
                
                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                    <div>
                        <span class="badge">${cat}</span>
                        <h1 class="page-title">${name}</h1>
                    </div>
                    <button class="fav-btn ${isFav ? 'active' : ''}" style="position:static; font-size:32px; margin-top:10px;" onclick="toggleFavorite('${attr.id}', event)">
                        ${isFav ? '❤️' : '♡'}
                    </button>
                </div>
                
                <div class="card">
                    <p class="card-description" style="font-size: 15px; color: var(--text-primary);">${desc}</p>
                    
                    <div class="tips-box">
                        <strong>💡 ${t['attraction.tips']}:</strong><br>
                        ${tips}
                    </div>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:20px;">
                    ${cityName ? `<button class="button" style="background:var(--surface-secondary); color:var(--text-primary); margin:0;" onclick="window.location.hash='#/city/${city.id}'">${t['attraction.city']}: ${cityName}</button>` : ''}
                    ${provName ? `<button class="button" style="background:var(--surface-secondary); color:var(--text-primary); margin:0;" onclick="window.location.hash='#/province/${prov.id}'">${t['attraction.province']}: ${provName}</button>` : ''}
                </div>

                ${getHirkanBanner(t)}
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderFavorites(t) {
            const favAttractions = ATTRACTIONS_DATA.filter(a => favorites.includes(a.id));
            const favProvinces = PROVINCES_DATA.filter(p => favorites.includes(p.id));
            const favCities = CITIES_DATA.filter(c => favorites.includes(c.id));

            let html = `<h1 class="page-title">${t['fav.title']}</h1>`;

            if (favAttractions.length === 0 && favProvinces.length === 0 && favCities.length === 0) {
                html += `
                    <div class="card" style="text-align:center; padding:40px 20px;">
                        <div style="font-size:40px; margin-bottom:16px;">♡</div>
                        <p class="card-description">${t['fav.empty']}</p>
                    </div>
                `;
            } else {
                if (favProvinces.length > 0) {
                    html += `<h2 class="section-title">${t['nav.provinces']}</h2><div class="grid">`;
                    html += favProvinces.map(p => generateProvinceCards([p], t)).join('');
                    html += `</div>`;
                }
                if (favCities.length > 0) {
                    html += `<h2 class="section-title">${t['attraction.city']}</h2><div class="grid">`;
                    html += favCities.map(c => `
                        <div class="card clickable" onclick="window.location.hash='#/city/${c.id}'">
                            <h3 class="card-title">${currentLang === 'fa' ? c.name_fa : c.name_en}</h3>
                        </div>
                    `).join('');
                    html += `</div>`;
                }
                if (favAttractions.length > 0) {
                    html += `<h2 class="section-title">${t['nav.attractions']}</h2><div class="grid">`;
                    html += favAttractions.map(a => generateAttractionCard(a, t)).join('');
                    html += `</div>`;
                }
            }
            html += getHirkanBanner(t);
            document.getElementById('app-content').innerHTML = html;
        }

        function renderSettings(t) {
            const html = `
                <h1 class="page-title">${t['settings.title']}</h1>
                
                <div class="card">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <div>
                            <div style="font-weight:700;">${t['settings.theme']}</div>
                            <div class="card-description">${t['settings.theme.desc']}</div>
                        </div>
                        <button class="button" style="margin:0;" onclick="toggleTheme()">${currentTheme === 'light' ? '☾' : '☀'}</button>
                    </div>
                    
                    <hr style="border:0; border-top:1px solid var(--border); margin:16px 0;">
                    
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:700;">${t['settings.lang']}</div>
                            <div class="card-description">${t['settings.lang.desc']}</div>
                        </div>
                        <button class="button" style="margin:0;" onclick="toggleLanguage()">${currentLang === 'fa' ? 'English' : 'فارسی'}</button>
                    </div>
                </div>

                <div class="card" style="margin-top:20px;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:700; color:var(--danger);">${t['settings.clear_fav']}</div>
                            <div class="card-description">${t['settings.clear_fav.desc']}</div>
                        </div>
                        <button class="button" style="margin:0; background:var(--danger);" onclick="clearFavorites()">${t['settings.clear_btn']}</button>
                    </div>
                </div>
                
                <div style="text-align:center; margin-top:40px; color:var(--text-muted); font-size:13px;">
                    ${t['settings.version']}: ${APP_VERSION}
                </div>

                ${getHirkanBanner(t)}
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        // =========================================
        // HELPERS
        // =========================================
        function getHirkanBanner(t) {
            return `
                <div class="hirkan-banner">
                    <div>
                        <div class="hirkan-banner-title">${t['hirkan.title']}</div>
                        <div class="hirkan-banner-description">${t['hirkan.desc']}</div>
                    </div>
                    <a href="https://hdg.hirkansara.ir" target="_blank" class="hirkan-banner-link">${t['hirkan.btn']}</a>
                </div>
            `;
        }

        function generateProvinceCards(data, t) {
            return data.map(p => {
                const name = currentLang === 'fa' ? p.name_fa : p.name_en;
                const desc = currentLang === 'fa' ? p.desc_fa : p.desc_en;
                const isFav = favorites.includes(p.id);
                return `
                    <div class="card clickable" onclick="window.location.hash='#/province/${p.id}'">
                        <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${p.id}', event)">
                            ${isFav ? '❤️' : '♡'}
                        </button>
                        <h3 class="card-title">${name}</h3>
                        <p class="card-description" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${desc}</p>
                    </div>
                `;
            }).join('');
        }

        function generateAttractionCard(attr, t) {
            const name = currentLang === 'fa' ? attr.name_fa : attr.name_en;
            const cat = currentLang === 'fa' ? attr.category_fa : attr.category_en;
            const isFav = favorites.includes(attr.id);
            
            return `
                <div class="card clickable" onclick="window.location.hash='#/attraction/${attr.id}'" style="padding: 12px;">
                    <button class="fav-btn ${isFav ? 'active' : ''}" style="top:8px; left:8px;" onclick="toggleFavorite('${attr.id}', event)">
                        ${isFav ? '❤️' : '♡'}
                    </button>
                    <span class="badge" style="font-size:10px; margin-bottom:4px; margin-left:25px;">${cat}</span>
                    <h3 class="card-title" style="font-size:15px;">${name}</h3>
                </div>
            `;
        }

        function performSearch(query) {
            const t = TRANSLATIONS[currentLang];
            const q = query.trim().toLowerCase();
            const searchResultsContainer = document.getElementById('search-results');
            const searchGrid = document.getElementById('search-grid');
            const mainContent = document.getElementById('main-content-area');

            if (q.length < 2) {
                searchResultsContainer.style.display = 'none';
                mainContent.style.display = 'block';
                return;
            }

            searchResultsContainer.style.display = 'block';
            mainContent.style.display = 'none';

            const matchedProvs = PROVINCES_DATA.filter(p => 
                p.name_fa.includes(q) || p.name_en.toLowerCase().includes(q)
            );

            const matchedAttrs = ATTRACTIONS_DATA.filter(a => 
                a.name_fa.includes(q) || a.name_en.toLowerCase().includes(q) ||
                a.desc_fa.includes(q) || a.desc_en.toLowerCase().includes(q)
            );

            if (matchedProvs.length === 0 && matchedAttrs.length === 0) {
                searchGrid.innerHTML = `<p>${t['no.results']}</p>`;
                return;
            }

            let html = '';
            
            if (matchedProvs.length > 0) {
                html += `<h3 style="grid-column: 1/-1; margin-top:10px; color:var(--primary);">${t['nav.provinces']}</h3>`;
                html += matchedProvs.map(p => generateProvinceCards([p], t)).join('');
            }

            if (matchedAttrs.length > 0) {
                html += `<h3 style="grid-column: 1/-1; margin-top:10px; color:var(--primary);">${t['nav.attractions']}</h3>`;
                html += matchedAttrs.map(a => generateAttractionCard(a, t)).join('');
            }

            searchGrid.innerHTML = html;
        }
        
        function filterAttractionsPage(query) {
            const t = TRANSLATIONS[currentLang];
            const q = query.trim().toLowerCase();
            const grid = document.getElementById('all-attractions-grid');
            
            if(q.length < 2) {
                 grid.innerHTML = ATTRACTIONS_DATA.map(a => generateAttractionCard(a, t)).join('');
                 return;
            }
            
            const matched = ATTRACTIONS_DATA.filter(a => 
                a.name_fa.includes(q) || a.name_en.toLowerCase().includes(q) ||
                a.desc_fa.includes(q) || a.desc_en.toLowerCase().includes(q)
            );
            
            if(matched.length === 0) {
                grid.innerHTML = `<p>${t['no.results']}</p>`;
            } else {
                grid.innerHTML = matched.map(a => generateAttractionCard(a, t)).join('');
            }
        }
    </script>

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
<script src="/data.js"></script>
