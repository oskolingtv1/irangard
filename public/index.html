        /* =========================================
           THEME VARIABLES
           ========================================= */
        :root {
            --primary: #0f766e;
            --primary-hover: #115e59;
            --primary-light: #ccfbf1;
            --background: #f8fafc;
            --surface: #ffffff;
            --surface-secondary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --banner-background: #134e4a;
            --banner-text: #ffffff;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
            --radius-sm: 8px;
            --radius-md: 14px;
            --radius-lg: 20px;
            --font-persian: "Vazirmatn", Tahoma, sans-serif;
            --font-default: system-ui, -apple-system, sans-serif;
        }

        [data-theme="dark"] {
            --primary: #2dd4bf;
            --primary-light: #134e4a;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-secondary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --border: #334155;
            --banner-background: #042f2e;
        }

        /* =========================================
           RESET & LAYOUT
           ========================================= */
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh;
            background: var(--background); color: var(--text-primary);
            font-family: var(--font-default); font-size: 15px; line-height: 1.7;
            transition: background 0.2s, color 0.2s;
        }
        html[lang="fa"] { font-family: var(--font-persian); }
        a { color: inherit; text-decoration: none; }
        button { cursor: pointer; font: inherit; }

        .app-container { max-width: 900px; margin-inline: auto; min-height: 100vh; position: relative; }
        .main-content { padding: 20px 16px 100px; }

        /* =========================================
           TOPBAR & NAV
           ========================================= */
        .topbar {
            height: 64px; display: flex; align-items: center; justify-content: space-between;
            padding-inline: 16px; background: var(--surface); border-bottom: 1px solid var(--border);
            position: sticky; top: 0; z-index: 100;
        }
        .brand { display: flex; align-items: center; gap: 8px; color: var(--primary); font-size: 19px; font-weight: 700; cursor: pointer; }
        .icon-button {
            width: 40px; height: 40px; border: 1px solid var(--border); border-radius: var(--radius-sm);
            background: var(--surface); color: var(--text-primary); display: flex; align-items: center; justify-content: center;
        }
        .language-button { padding: 8px 12px; background: var(--primary-light); color: var(--primary); border: none; border-radius: var(--radius-sm); font-weight: 700; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 900px; height: 68px; display: flex; align-items: center; justify-content: space-around;
            background: var(--surface); border-top: 1px solid var(--border); z-index: 100;
        }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-muted); font-size: 11px; cursor: pointer; }
        .nav-icon { font-size: 22px; }
        .nav-item.active { color: var(--primary); font-weight: 700; }

        /* =========================================
           CONTENT & CARDS
           ========================================= */
        .page-title { margin: 0 0 8px; font-size: 25px; font-weight: 700; }
        .page-subtitle { margin: 0 0 22px; color: var(--text-secondary); font-size: 14px; }
        .section-title { margin: 26px 0 14px; font-size: 19px; font-weight: 700; }
        
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px; box-shadow: var(--shadow-sm); margin-bottom: 12px; }
        .card.clickable { cursor: pointer; transition: transform 0.2s; }
        .card.clickable:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
        .card-title { margin: 0 0 6px; font-size: 17px; font-weight: 700; color: var(--primary); }
        .card-description { margin: 0; color: var(--text-secondary); font-size: 13px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .button {
            display: inline-flex; align-items: center; justify-content: center;
            min-height: 44px; padding: 10px 18px; border: none; border-radius: var(--radius-md);
            background: var(--primary); color: #fff; font-weight: 700; margin-top: 16px; text-decoration: none;
        }
        .search-container { position: relative; margin: 20px 0; }
        .input {
            width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--border);
            border-radius: var(--radius-md); background: var(--surface); color: var(--text-primary); outline: none;
        }
        .input:focus { border-color: var(--primary); }

        /* =========================================
           HIRKAN PROMO BANNER
           ========================================= */
        .hirkan-banner {
            margin-top: 32px; padding: 18px; background: var(--banner-background); color: var(--banner-text);

        .hirkan-banner-title { margin: 0 0 4px; font-size: 16px; font-weight: 700; }
        .hirkan-banner-description { margin: 0; font-size: 12px; opacity: 0.85; }
        .hirkan-banner-link { padding: 8px 12px; border: 1px solid rgba(255,255,255,0.5); border-radius: var(--radius-sm); color: white; font-size: 12px; font-weight: 700; }
    </style>
</head>

            { id: 'sari', name_fa: 'ساری', name_en: 'Sari', province_id: 'mazandaran', desc_fa: 'ساری مرکز مازندران و شهری سرسبز در نزدیکی جنگل‌ها و دریای خزر است.', desc_en: 'Sari is the capital of Mazandaran, a green city near forests and the Caspian Sea.' },
            { id: 'gorgan', name_fa: 'گرگان', name_en: 'Gorgan', province_id: 'golestan', desc_fa: 'گرگان شهری تاریخی با طبیعت سرسبز و دسترسی به جنگل‌های هیرکانی است.', desc_en: 'Gorgan is a historic city surrounded by green landscapes and Hyrcanian forests.' },
            { id: 'qazvin', name_fa: 'قزوین', name_en: 'Qazvin', province_id: 'qazvin', desc_fa: 'قزوین شهری تاریخی با بناهای صفوی، مساجد قدیمی و شیرینی‌های سنتی است.', desc_en: 'Qazvin is a historic city known for Safavid architecture, ancient mosques, and traditional sweets.' },
            { id: 'arak', name_fa: 'اراک', name_en: 'Arak', province_id: 'markazi', desc_fa: 'اراک مرکز استان مرکزی و شهری با پیشینه صنعتی و جاذبه‌های تاریخی است.', desc_en: 'Arak is the capital of Markazi Province, known for its industrial heritage and historical attractions.' },
            { id: 'hamadan', name_fa: 'همدان', name_en: 'Hamadan', province_id: 'hamadan', desc_fa: 'همدان از کهن‌ترین شهرهای ایران و میزبان آرامگاه بوعلی سینا است.', desc_en: 'Hamadan is one of Iran’s oldest cities and home to the Avicenna Mausoleum.' },
            { id: 'sanandaj', name_fa: 'سنندج', name_en: 'Sanandaj', province_id: 'kurdistan', desc_fa: 'سنندج مرکز کردستان و شهری شناخته‌شده برای موسیقی و فرهنگ کردی است.', desc_en: 'Sanandaj is the capital of Kurdistan and is renowned for Kurdish music and culture.' },
            { id: 'kermanshah', name_fa: 'کرمانشاه', name_en: 'Kermanshah', province_id: 'kermanshah', desc_fa: 'کرمانشاه شهری تاریخی در زاگرس و نزدیک به مجموعه باستانی طاق بستان است.', desc_en: 'Kermanshah is a historic Zagros city near the ancient Taq-e Bostan complex.' },
            { id: 'khorramabad', name_fa: 'خرم‌آباد', name_en: 'Khorramabad', province_id: 'lorestan', desc_fa: 'خرم‌آباد شهری سرسبز با قلعه فلک‌الافلاک و آبشارهای دیدنی است.', desc_en: 'Khorramabad is a green city famous for Falak-ol-Aflak Castle and scenic waterfalls.' },
            { id: 'ilam', name_fa: 'ایلام', name_en: 'Ilam', province_id: 'ilam', desc_fa: 'ایلام شهری کوهستانی با جنگل‌های بلوط و طبیعت زیبای زاگرس است.', desc_en: 'Ilam is a mountainous city surrounded by oak forests and beautiful Zagros landscapes.' },
            { id: 'ahvaz', name_fa: 'اهواز', name_en: 'Ahvaz', province_id: 'khuzestan', desc_fa: 'اهواز مرکز خوزستان و شهری بزرگ در کنار رودخانه کارون است.', desc_en: 'Ahvaz is the capital of Khuzestan and a major city situated along the Karun River.' },
            { id: 'shahrekord', name_fa: 'شهرکرد', name_en: 'Shahrekord', province_id: 'chaharmahal-and-bakhtiari', desc_fa: 'شهرکرد یکی از مرتفع‌ترین مراکز استان ایران و شهری با آب‌وهوای خنک است.', desc_en: 'Shahrekord is one of Iran’s highest provincial capitals and is known for its cool climate.' },
            { id: 'yasuj', name_fa: 'یاسوج', name_en: 'Yasuj', province_id: 'kohgiluyeh-and-boyer-ahmad', desc_fa: 'یاسوج شهری کوهستانی با آبشارها و جنگل‌های زیبای بلوط است.', desc_en: 'Yasuj is a mountainous city known for its waterfalls and beautiful oak forests.' },
            { id: 'bushehr', name_fa: 'بوشهر', name_en: 'Bushehr', province_id: 'bushehr', desc_fa: 'بوشهر شهری بندری با معماری تاریخی و چشم‌انداز زیبای خلیج فارس است.', desc_en: 'Bushehr is a port city with historic architecture and beautiful Persian Gulf views.' },
            { id: 'bandar-abbas', name_fa: 'بندرعباس', name_en: 'Bandar Abbas', province_id: 'hormozgan', desc_fa: 'بندرعباس مرکز هرمزگان و یکی از مهم‌ترین شهرهای بندری جنوب ایران است.', desc_en: 'Bandar Abbas is the capital of Hormozgan and one of southern Iran’s most important port cities.' },
            { id: 'zahedan', name_fa: 'زاهدان', name_en: 'Zahedan', province_id: 'sistan-and-baluchestan', desc_fa: 'زاهدان مرکز سیستان و بلوچستان و شهری با فرهنگ بومی متنوع است.', desc_en: 'Zahedan is the capital of Sistan and Baluchestan and a city with diverse local cultures.' },
            { id: 'kerman', name_fa: 'کرمان', name_en: 'Kerman', province_id: 'kerman', desc_fa: 'کرمان شهری تاریخی با بازارهای سنتی، باغ شاهزاده و آثار معماری ارزشمند است.', desc_en: 'Kerman is a historic city known for traditional bazaars, Shazdeh Garden, and valuable architecture.' },
            { id: 'yazd', name_fa: 'یزد', name_en: 'Yazd', province_id: 'yazd', desc_fa: 'یزد شهری کویری با بادگیرهای سنتی و بافت تاریخی ثبت‌شده در یونسکو است.', desc_en: 'Yazd is a desert city famous for traditional windcatchers and its UNESCO-listed historic center.' },
            { id: 'semnan', name_fa: 'سمنان', name_en: 'Semnan', province_id: 'semnan', desc_fa: 'سمنان شهری تاریخی در حاشیه کویر با جاذبه‌های طبیعی و فرهنگی است.', desc_en: 'Semnan is a historic city on the edge of the desert with natural and cultural attractions.' },
            { id: 'qom', name_fa: 'قم', name_en: 'Qom', province_id: 'qom', desc_fa: 'قم شهری مذهبی و تاریخی با حرم حضرت معصومه و مراکز فرهنگی است.', desc_en: 'Qom is a religious and historic city known for the Shrine of Fatima Masumeh and cultural centers.' }
        ];

        // =========================================
        // TRANSLATIONS
        // =========================================
        const TRANSLATIONS = {
            "fa": {
                "home.title": "به ایران‌گرد هیرکان خوش آمدید",
                "home.desc": "زیبایی‌های ایران را کشف کنید",
                "nav.home": "خانه",
                "nav.provinces": "استان‌ها",
                "nav.travel_info": "اطلاعات سفر",
                "nav.favorites": "علاقه‌مندی‌ها",
                "nav.settings": "تنظیمات",
                "hirkan.title": "توسعه‌یافته توسط هیرکان",
                "hirkan.desc": "طراحی و توسعه توسط Hirkan Develop Group",
                "hirkan.btn": "وب‌سایت هیرکان",
                "search.placeholder": "جستجوی استان یا شهر...",
                "provinces.title": "استان‌های ایران",
                "province.capital": "مرکز استان",
                "btn.back": "بازگشت",
                "btn.view_city": "مشاهده شهر"
            },
            "en": {
                "home.title": "Welcome to Irangard Hirkan",
                "home.desc": "Discover the beauty of Iran",
                "nav.home": "Home",
                "nav.provinces": "Provinces",
                "nav.travel_info": "Travel Info",
                "nav.favorites": "Favorites",
                "nav.settings": "Settings",
                "hirkan.title": "Developed by Hirkan",
                "hirkan.desc": "Designed and developed by Hirkan Develop Group",
                "hirkan.btn": "Hirkan Website",
                "search.placeholder": "Search province or city...",
                "provinces.title": "Provinces of Iran",
                "province.capital": "Capital",
                "btn.back": "Back",
                "btn.view_city": "View City"
            }
        };

        let currentLang = "fa";
        let currentTheme = "light";

        // =========================================
        // INIT & EVENTS
        // =========================================
        document.getElementById('theme-toggle').addEventListener('click', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('theme-toggle').textContent = currentTheme === 'light' ? '☾' : '☀';
        });

        document.getElementById('lang-toggle').addEventListener('click', () => {
            currentLang = currentLang === 'fa' ? 'en' : 'fa';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'fa' ? 'rtl' : 'ltr';
            document.getElementById('lang-toggle').textContent = currentLang === 'fa' ? 'EN' : 'FA';
            router(); // Re-render current page
        });

        // =========================================
        // ROUTER
        // =========================================
        function router() {
            const hash = window.location.hash || '#/';
            const parts = hash.split('/').filter(Boolean);
            const t = TRANSLATIONS[currentLang];

            // Update bottom nav active state
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            
            if (parts[0] === 'province' && parts[1]) {
                renderProvince(parts[1], t);
            } else if (parts[0] === 'city' && parts[1]) {
                renderCity(parts[1], t);
            } else if (parts[0] === 'provinces') {
                document.querySelectorAll('.nav-item')[1].classList.add('active');
                renderProvincesList(t);
            } else {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
                renderHome(t);
            }
        }

        // =========================================
        // VIEWS
        // =========================================
        function renderHome(t) {
            const html = `
                <h1 class="page-title">${t['home.title']}</h1>
                <p class="page-subtitle">${t['home.desc']}</p>
                
                <div class="search-container">
                    <input type="search" id="search-input" class="input" placeholder="${t['search.placeholder']}" oninput="filterProvinces(this.value)" />
                </div>

                <h2 class="section-title">${t['provinces.title']}</h2>
                <div id="provinces-grid" class="grid">
                    ${generateProvinceCards(PROVINCES_DATA, t)}
                </div>

                <div class="hirkan-banner">
                    <div>
                        <div class="hirkan-banner-title">${t['hirkan.title']}</div>
                        <div class="hirkan-banner-description">${t['hirkan.desc']}</div>
                    </div>
                    <a href="https://hdg.hirkansara.ir" target="_blank" class="hirkan-banner-link">${t['hirkan.btn']}</a>
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderProvincesList(t) {
            const html = `
                <h1 class="page-title">${t['provinces.title']}</h1>
                <div class="search-container">
                    <input type="search" id="search-input" class="input" placeholder="${t['search.placeholder']}" oninput="filterProvinces(this.value)" />
                </div>
                <div id="provinces-grid" class="grid">
                    ${generateProvinceCards(PROVINCES_DATA, t)}
                </div>
                <div class="hirkan-banner" style="margin-top: 40px;">
                    <div>
                        <div class="hirkan-banner-title">${t['hirkan.title']}</div>
                        <div class="hirkan-banner-description">${t['hirkan.desc']}</div>
                    </div>
                    <a href="https://hdg.hirkansara.ir" target="_blank" class="hirkan-banner-link">${t['hirkan.btn']}</a>
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderProvince(id, t) {
            const prov = PROVINCES_DATA.find(p => p.id === id);
            if (!prov) return renderHome(t);

            const capital = CITIES_DATA.find(c => c.id === prov.capital_id);
            const name = currentLang === 'fa' ? prov.name_fa : prov.name_en;
            const desc = currentLang === 'fa' ? prov.desc_fa : prov.desc_en;
            const capName = capital ? (currentLang === 'fa' ? capital.name_fa : capital.name_en) : '';

            const html = `
                <button class="button" style="background: var(--surface-secondary); color: var(--text-primary); border: 1px solid var(--border); margin-bottom: 20px;" onclick="history.back()">
                    ← ${t['btn.back']}
                </button>
                <h1 class="page-title">${name}</h1>
                <p class="page-subtitle">${desc}</p>

                <div class="card">
                    <h2 class="card-title">${t['province.capital']}</h2>
                    <p class="card-description">${capName}</p>
                    ${capital ? `<button class="button" onclick="window.location.hash='#/city/${capital.id}'">${t['btn.view_city']}</button>` : ''}
                </div>

                <div class="hirkan-banner">
                    <div>
                        <div class="hirkan-banner-title">${t['hirkan.title']}</div>
                        <div class="hirkan-banner-description">${t['hirkan.desc']}</div>
                    </div>
                    <a href="https://hdg.hirkansara.ir" target="_blank" class="hirkan-banner-link">${t['hirkan.btn']}</a>
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        function renderCity(id, t) {
            const city = CITIES_DATA.find(c => c.id === id);
            if (!city) return renderHome(t);
            
            const prov = PROVINCES_DATA.find(p => p.id === city.province_id);

            const name = currentLang === 'fa' ? city.name_fa : city.name_en;
            const desc = currentLang === 'fa' ? city.desc_fa : city.desc_en;
            const provName = prov ? (currentLang === 'fa' ? prov.name_fa : prov.name_en) : '';

            const html = `
                <button class="button" style="background: var(--surface-secondary); color: var(--text-primary); border: 1px solid var(--border); margin-bottom: 20px;" onclick="history.back()">
                    ← ${t['btn.back']}
                </button>
                <h1 class="page-title">${name}</h1>
                <p class="page-subtitle">${provName}</p>

                <div class="card">
                    <p class="card-description" style="font-size: 15px;">${desc}</p>
                </div>

                <div class="hirkan-banner">
                    <div>
                        <div class="hirkan-banner-title">${t['hirkan.title']}</div>
                        <div class="hirkan-banner-description">${t['hirkan.desc']}</div>
                    </div>
                    <a href="https://hdg.hirkansara.ir" target="_blank" class="hirkan-banner-link">${t['hirkan.btn']}</a>
                </div>
            `;
            document.getElementById('app-content').innerHTML = html;
        }

        // =========================================
        // HELPERS
        // =========================================
        function generateProvinceCards(data, t) {
            return data.map(p => {
                const name = currentLang === 'fa' ? p.name_fa : p.name_en;
                const desc = currentLang === 'fa' ? p.desc_fa : p.desc_en;
                return `
                    <div class="card clickable" onclick="window.location.hash='#/province/${p.id}'">
                        <h3 class="card-title">${name}</h3>
                        <p class="card-description" style="display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">${desc}</p>
                    </div>
                `;
            }).join('');
        }

        function filterProvinces(query) {
            const t = TRANSLATIONS[currentLang];
            const q = query.toLowerCase();
            const filtered = PROVINCES_DATA.filter(p => 
                p.name_fa.includes(q) || p.name_en.toLowerCase().includes(q) || 
                p.desc_fa.includes(q) || p.desc_en.toLowerCase().includes(q)
            );
            document.getElementById('provinces-grid').innerHTML = generateProvinceCards(filtered, t);
        }

        // Start App
        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', () => {
            if (!window.location.hash) window.location.hash = '#/';
            router();
        });
    </script>
</body>
</html>
